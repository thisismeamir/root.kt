name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up ROOT
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dpkg-dev cmake g++ gcc binutils \
            libx11-dev libxpm-dev libxft-dev libxext-dev libssl-dev \
            libgsl-dev
          wget -q https://root.cern/download/root_v6.32.02.Linux-ubuntu22.04-x86_64-gcc11.4.tar.gz
          tar -xzf root_v6.32.02.Linux-ubuntu22.04-x86_64-gcc11.4.tar.gz
          echo "$GITHUB_WORKSPACE/root/bin" >> $GITHUB_PATH
          echo "ROOTSYS=$GITHUB_WORKSPACE/root" >> $GITHUB_ENV

      - name: Generate test fixtures
        run: |
          source $ROOTSYS/bin/thisroot.sh
          chmod +x generate.sh
          ./generate.sh root

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and test
        run: ./gradlew test --continue

      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Upload test reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7